[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-instinct"
version = "0.2.0"
description = "Instinct Engine: a frozen, non-learning 'instinct' signal source driven by a real fruit-fly (MaleCNS) connectome"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "roblitz" }]
keywords = ["connectome", "fruit-fly", "neuroscience",
            "reservoir-computing", "spiking-neurons", "generative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.6"]
# 完整 1.05GB feather 连接组的一次性转换依赖
full = ["pandas>=1.5", "pyarrow>=10"]

[project.urls]
Homepage = "https://github.com/roblitz-spec/fly-instinct"
Data = "https://male-cns.janelia.org"

[project.scripts]
fly-instinct-fetch-data = "fly_instinct.datafetch:main"
fly-instinct-get-full = "fly_instinct.fullconnectome:main"

[tool.setuptools]
packages = ["fly_instinct"]

# 内置预设 JSON 随包分发
[tool.setuptools.package-data]
fly_instinct = ["presets/*.json"]
